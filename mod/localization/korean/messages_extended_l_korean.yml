l_korean:
 mex_clear_messages_tooltip: "#T 모든 메시지 지우기#!\n오른쪽 아래 메시지를 닫습니다.\nCtrl+Shift+F 또는 메시지에서 Ctrl+오른쪽 클릭."
 mex_settings_tooltip: "#T 메시지 표시 설정#!\n메시지를 표시할 조건을 설정합니다."
 mex_hide_on_windows: "창을 열면 숨기기"
 mex_hide_on_windows_tooltip: "오른쪽 창이 열려 있는 동안 메시지를 숨깁니다. Ctrl+Shift+F로 계속 지울 수 있습니다."
 mex_hide_all: "메시지 모두 숨기기"
 mex_hide_all_tooltip: "수신을 중단하지 않고 목록을 숨깁니다. 화살표 또는 메시지 표시 결단으로 복원합니다.\n$mex_toggle_messages_shortcut$"
 mex_restore_messages_tooltip: "#T 메시지 표시#!\n목록을 복원합니다. 창을 열면 숨기기가 활성화되어 있다면 오른쪽 창을 닫으십시오.\n$mex_toggle_messages_shortcut$"
 mex_show_messages_decision: "메시지 표시"
 mex_show_messages_decision_desc: "오른쪽 아래 메시지를 복원합니다. 오른쪽 창 때문에 숨겨진 경우 창을 닫으면 나타납니다."
 mex_show_messages_decision_tooltip: "메시지 목록을 다시 표시합니다."
 mex_show_messages_decision_confirm: "$CONFIRM$"
 mex_message_click_tooltip: "#I 클릭하여 펼칩니다.\n오른쪽 클릭으로 이 메시지를 닫습니다.\nCtrl+오른쪽 클릭으로 모든 메시지를 닫습니다.#!"
 mex_ctrl_clear_tooltip: "#I 이 메시지의 아무 곳에서나 Ctrl+오른쪽 클릭하면 모든 메시지가 닫힙니다.#!"
 mex_toggle_messages_shortcut: "Ctrl+Shift+M: 메시지 표시 또는 숨기기."
