l_russian:
 mex_clear_messages_tooltip: "#T Убрать все сообщения#!\nЗакрыть сообщения справа внизу.\nCtrl+Shift+F или Ctrl+щелчок правой кнопкой по сообщению."
 mex_settings_tooltip: "#T Отображение сообщений#!\nВыбрать, когда показывать сообщения."
 mex_hide_on_windows: "Скрывать при открытии окон"
 mex_hide_on_windows_tooltip: "Скрывать ленту, пока справа открыто окно. Ctrl+Shift+F по-прежнему убирает сообщения."
 mex_hide_all: "Полностью скрыть сообщения"
 mex_hide_all_tooltip: "Скрыть ленту, не прекращая получение сообщений. Вернуть её стрелкой или решением «Показать сообщения».\n$mex_toggle_messages_shortcut$"
 mex_restore_messages_tooltip: "#T Показать сообщения#!\nВернуть ленту. Если включено скрытие при открытии окон, закройте окно справа.\n$mex_toggle_messages_shortcut$"
 mex_show_messages_decision: "Показать сообщения"
 mex_show_messages_decision_desc: "Вернуть сообщения в правый нижний угол. Если они скрыты из-за открытого окна справа, они появятся после его закрытия."
 mex_show_messages_decision_tooltip: "Снова показать ленту сообщений."
 mex_show_messages_decision_confirm: "$CONFIRM$"
 mex_message_click_tooltip: "#I Щёлкните, чтобы развернуть.\nПравая кнопка закрывает это сообщение.\nCtrl+правая кнопка закрывает все сообщения.#!"
 mex_ctrl_clear_tooltip: "#I Ctrl+щелчок правой кнопкой в любом месте этого сообщения закрывает все сообщения.#!"
 mex_toggle_messages_shortcut: "Ctrl+Shift+M: показать или скрыть сообщения."
