l_french:
 mex_clear_messages_tooltip: "#T Effacer tous les messages#!\nFermer les messages en bas à droite.\nCtrl+Maj+F ou Ctrl+clic droit sur un message."
 mex_settings_tooltip: "#T Affichage des messages#!\nChoisir quand les messages sont visibles."
 mex_hide_on_windows: "Masquer à l’ouverture des fenêtres"
 mex_hide_on_windows_tooltip: "Masquer le fil lorsqu’une fenêtre est ouverte à droite. Ctrl+Maj+F permet toujours de le vider."
 mex_hide_all: "Masquer tous les messages"
 mex_hide_all_tooltip: "Masquer le fil sans interrompre la réception. Le rétablir avec la flèche ou la décision « Afficher les messages ».\n$mex_toggle_messages_shortcut$"
 mex_restore_messages_tooltip: "#T Afficher les messages#!\nRétablir le fil. Si le masquage à l’ouverture des fenêtres est actif, fermer la fenêtre de droite.\n$mex_toggle_messages_shortcut$"
 mex_show_messages_decision: "Afficher les messages"
 mex_show_messages_decision_desc: "Rétablir les messages en bas à droite. S’ils sont masqués par une fenêtre ouverte à droite, ils réapparaîtront à sa fermeture."
 mex_show_messages_decision_tooltip: "Afficher de nouveau le fil des messages."
 mex_show_messages_decision_confirm: "$CONFIRM$"
 mex_message_click_tooltip: "#I Cliquer pour développer.\nClic droit pour fermer ce message.\nCtrl+clic droit pour fermer tous les messages.#!"
 mex_ctrl_clear_tooltip: "#I Ctrl+clic droit n’importe où sur ce message pour fermer tous les messages.#!"
 mex_toggle_messages_shortcut: "Ctrl+Maj+M : afficher ou masquer les messages."
