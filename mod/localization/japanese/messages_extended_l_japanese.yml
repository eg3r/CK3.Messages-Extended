l_japanese:
 mex_clear_messages_tooltip: "#T すべてのメッセージを消去#!\n右下のメッセージを閉じます。\nCtrl+Shift+F、またはメッセージをCtrl+右クリック。"
 mex_settings_tooltip: "#T メッセージの表示設定#!\nメッセージを表示する条件を設定します。"
 mex_hide_on_windows: "ウィンドウを開くと非表示"
 mex_hide_on_windows_tooltip: "右側のウィンドウが開いている間は一覧を隠します。Ctrl+Shift+Fによる消去は引き続き可能です。"
 mex_hide_all: "メッセージをすべて非表示"
 mex_hide_all_tooltip: "受信を止めずに一覧を隠します。矢印または「メッセージを表示」の決断で戻せます。\n$mex_toggle_messages_shortcut$"
 mex_restore_messages_tooltip: "#T メッセージを表示#!\n一覧を再表示します。ウィンドウを開くと非表示にする設定の場合は、右側のウィンドウを閉じてください。\n$mex_toggle_messages_shortcut$"
 mex_show_messages_decision: "メッセージを表示"
 mex_show_messages_decision_desc: "右下のメッセージを再表示します。右側のウィンドウが原因で隠れている場合は、閉じると表示されます。"
 mex_show_messages_decision_tooltip: "メッセージ一覧を再表示します。"
 mex_show_messages_decision_confirm: "$CONFIRM$"
 mex_message_click_tooltip: "#I クリックして展開。\n右クリックでこのメッセージを閉じます。\nCtrl+右クリックですべて閉じます。#!"
 mex_ctrl_clear_tooltip: "#I このメッセージの任意の場所をCtrl+右クリックすると、すべてのメッセージを閉じます。#!"
 mex_toggle_messages_shortcut: "Ctrl+Shift+M：メッセージの表示と非表示を切り替えます。"
